name: PLUTON Real Runtime Verification

on: [push, pull_request]

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Вчитување на кодот (Checkout Repo)
      uses: actions/checkout@v4

    - name: 2. Покренување на Docker Compose во живо
      run: |
        docker compose down -v
        docker compose up --build -d

    - name: 3. Чекање на иницијализација на PostgreSQL и FastAPI серверот
      run: |
        echo "Се чека апликацијата на порт 3000..."
        for i in {1..15}; do
          if curl -s http://localhost:3000/api/health | grep -q "ok"; then
            echo "УСПЕШНО: PLUTON серверот и PostgreSQL базата се покренати!"
            exit 0
          fi
          echo "Се чека иницијализација (Обид $i/15)..."
          sleep 2
        done
        echo "ГРЕШКА: Времето истече, контејнерите не се покренаа!"
        docker compose logs
        exit 1

    - name: 4. Финална HTTP Верификација на /api/health
      run: curl -s http://localhost:3000/api/health
