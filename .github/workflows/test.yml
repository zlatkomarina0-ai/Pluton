name: PLUTON Automated Production Verification
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  verify-system:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pluton_db
          POSTGRES_USER: pluton_user
          POSTGRES_PASSWORD: pluton_password
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Create Production .env Config
      run: |
        echo "DATABASE_URL=postgresql://pluton_user:pluton_password@localhost:5432/pluton_db" > .env
        echo "PORT=3000" >> .env
        echo "NODE_ENV=production" >> .env
    - run: npm install
    - run: npm start &
    - name: Verify API Health Endpoint
      run: |
        sleep 5
        curl --fail http://localhost:3000/api/health || exit 1

