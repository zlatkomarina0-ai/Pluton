name: PLUTON Real Runtime Verification

on: [push]

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Вчитување на кодот од репозиториумот
      uses: actions/checkout@v4

    - name: 2. Оркестрација и градење со Docker Compose
      run: |
        docker compose down -v
        docker compose up --build -d

    - name: 3. Чекање на иницијализација на PostgreSQL и FastAPI серверот
      run: |
        echo "Се чека апликацијата на порт 3000..."
        for i in {1..15}; do
          if curl -s http://localhost:3000/api/health | grep -q "ok"; then
            echo "УСПЕШНО: PLUTON Engine е успешно покренат во Docker!"
            exit 0
          fi
          echo "Се чека иницијализација на базата (Обид $i/15)..."
          sleep 2
        done
        echo "ГРЕШКА: Времето истече!"
        docker compose logs
        exit 1

    - name: 4. Финална HTTP Верификација на /api/health
      run: curl -s http://localhost:3000/api/health
