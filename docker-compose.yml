name: PLUTON Real Runtime Verification

on: [push, pull_request]

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Вчитување на кодот (Checkout Repo)
      uses: actions/checkout@v4

    - name: 2. Оркестрација и градење на Docker Compose во живо
      run: |
        docker compose down -v
        docker compose up --build -d

    - name: 3. Интелигентно чекање на PostgreSQL и FastAPI серверот
      run: |
        echo "Се чека апликацијата на порт 3000..."
        for i in {1..15}; do
          if curl -s http://localhost:3000/api/health | grep -q "ok"; then
            echo "УСПЕШНО: PLUTON контејнерот и PostgreSQL базата се покренати во облак!"
            exit 0
          fi
          echo "Базата сè уште се иницијализира (Обид $i/15)..."
          sleep 2
        done
        echo "ГРЕШКА: Времето за иницијализација истече!"
        docker compose logs
        exit 1

    - name: 4. Финална HTTP Верификација на /api/health
      run: curl -s http://localhost:3000/api/health
