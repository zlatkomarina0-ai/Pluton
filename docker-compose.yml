version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://pluton_user:pluton_password@db:5432/pluton_db
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB: pluton_db
      - POSTGRES_USER: pluton_user
      - POSTGRES_PASSWORD: pluton_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Точно мапирање на твоите реални SQL скрипти од локалната меморија
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/migrations/001_phase1_base_schema.sql:/docker-entrypoint-initdb.d/2-migration.sql
      - ./database/seeds/001_realistic_seed_data.sql:/docker-entrypoint-initdb.d/3-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluton_user -d pluton_db"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
