version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pluton-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pluton_db
      POSTGRES_USER: pluton_user
      POSTGRES_PASSWORD: pluton_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluton_user -d pluton_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pluton-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://pluton_user:pluton_password@db:5432/pluton_db
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pluton-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  postgres_data:
