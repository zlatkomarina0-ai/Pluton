version: '3.8'

services:
  backend:
    # Docker гради апликацију из фолдера backend/backend где се реално налазе Dockerfile и requirements.txt
    build:
      context: .
      dockerfile: backend/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://pluton_user:pluton_password@db:5432/pluton_db
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=pluton_db
      - POSTGRES_USER=pluton_user
      - POSTGRES_PASSWORD=pluton_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Аутоматско покретање база и семена из твог database/ фолдера
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluton_user -d pluton_db"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
